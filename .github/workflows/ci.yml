name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Native compile + unit specs finish in well under 10 min; the cap just keeps
    # a wedged build from sitting until GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The core crate is statically linked into the extension and pulls in
      # libcap-ng on Linux (via the caps/capng crates). The ubuntu runners don't
      # ship libcap-ng-dev, so the final link fails with `cannot find -lcap-ng`
      # without this. macOS uses a different code path and needs none of it.
      # Mirrors the upstream core crate's documented Linux build dependencies.
      # (The gem is SDK-only: no msb/libkrunfw host runtime is downloaded or
      # built at compile time — see ext/microsandbox/Cargo.toml.)
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev gcc make flex bison libelf-dev bc python3-pyelftools

      # The core crate is a pinned git dependency, so the build is self-contained
      # (no adjacent checkout needed). Rust is required to compile the extension.
      # The repo's rust-toolchain.toml pins `stable`; this keeps the action's
      # installed toolchain in sync (the input is `rustup-toolchain`, not
      # `rust-toolchain` — the latter is silently ignored).
      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: ${{ matrix.ruby }}
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Run unit specs
        run: bundle exec rake spec

  # Build the gem and install it from the packed artifact, exercising the
  # from-gem source-compile path end to end. Every other job compiles the
  # working tree in place (`rake compile`), so the gemspec `spec.files` glob and
  # the from-gem build are never validated — a packaging regression (an omitted
  # source file, a stale/absent Cargo.lock or rust-toolchain.toml, a renamed
  # path) would reach RubyGems and break `gem install microsandbox-rb` (the
  # install path on every platform: no precompiled gems are published) with no
  # pre-publish signal.
  # No KVM/microVM boot, so it runs cheaply on a hosted runner.
  package:
    name: package (install built source gem + binaries gem)
    needs: [binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev gcc make flex bison libelf-dev bc python3-pyelftools

      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: "3.4"
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true

      - name: Build the gem (packs spec.files)
        run: bundle exec rake build

      # Compile from the PACKED source (extconf.rb + cargo against the packed
      # root Cargo.toml/Cargo.lock/rust-toolchain.toml + ext/ sources), then load
      # it from outside the repo so the installed gem — not the working-tree
      # lib/ — is what `require` resolves. Plain `ruby` (not `bundle exec`, which
      # would load the local source gem via the Gemfile `gemspec`).
      - name: Install the packed gem and require it
        run: |
          gem install pkg/microsandbox-rb-*.gem
          cd "$RUNNER_TEMP"
          ruby -e 'require "microsandbox"; puts "version=#{Microsandbox.version} runtime=#{Microsandbox.runtime_version}"'

      # The two-gem model end to end, the way a user gets it (`gem install` of
      # both, no Bundler, no checkout): the companion gem built by the
      # `binaries` job must be what `require "microsandbox"` wires into the
      # core resolver, its msb must run and report the wrapped runtime version,
      # and `ensure_runtime!` must then skip the ~/.microsandbox installer. Runs
      # with MICROSANDBOX_NO_AUTO_INSTALL unset so a silently inactive tier
      # would surface as an unexpected download attempt, not pass by fallback.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-gems
          path: binaries-gems
      - name: Install the host binaries gem and check the SDK resolves into it
        run: |
          gem install --local --no-document binaries-gems/microsandbox-rb-binaries-*-x86_64-linux-gnu.gem
          cd "$RUNNER_TEMP"
          ruby -e '
            require "microsandbox"
            path = Microsandbox.runtime_path
            gem_root = Gem.loaded_specs.fetch("microsandbox-rb-binaries").full_gem_path
            abort("resolver returned #{path}, expected the binaries gem under #{gem_root}") unless path == Microsandbox::Binaries.msb_path && path.start_with?(gem_root)
            out = IO.popen([path, "--version"], &:read)
            abort("msb --version failed") unless $?.success?
            abort("msb reports #{out.strip.inspect}, expected #{Microsandbox::RUNTIME_VERSION}") unless out.split.include?(Microsandbox::RUNTIME_VERSION.delete_prefix("v"))
            Microsandbox.define_singleton_method(:install) { abort("ensure_runtime! ran the installer despite the bundled runtime") }
            Microsandbox.ensure_runtime!
            puts "ok: #{out.strip} from #{path}"
          '

  # Real-microVM integration tests — the round-trip verification that the unit
  # suite (which stubs the native layer) cannot provide. Boots actual sandboxes
  # from an OCI image and exercises exec/shell/fs/metrics/logs end-to-end.
  #
  # Requires KVM. GitHub-hosted Linux runners expose /dev/kvm (nested virt); the
  # udev step below grants the runner user access to it. The official repo runs
  # the equivalent suites on self-hosted KVM runners — if GitHub-hosted KVM
  # proves insufficient for the heavy core runtime on the first run, point this
  # job at a self-hosted runner (set `runs-on`) exactly as upstream does.
  #
  # Runs on pushes to main and manual dispatch (not on every PR) so external
  # contributors aren't gated on KVM availability.
  #
  # Runs once per runtime source: `provisioned` boots from the first-use
  # download into ~/.microsandbox (the fallback tier every install without the
  # companion gem relies on) and `bundled` boots from the msb + libkrunfw
  # vendored by the microsandbox-rb-binaries gem — the only place the gem's
  # binaries are proven to run a real VM, not just to resolve and print a
  # version (a runtime that merely exists but can't boot is the failure mode
  # that bit v0.5.9).
  integration:
    name: integration (real microVM, KVM, ${{ matrix.runtime }} runtime)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [provisioned, bundled]
    # A full run (compile + boot real microVMs + specs) lands around 10-12 min.
    # This cap is the safety net: a single deadlocked spec (e.g. a guest process
    # blocked on stdin that never gets EOF) would otherwise wedge the job until
    # GitHub's 6-hour default and surface the whole run as "cancelled".
    #
    # Raised from 20 to 25 to absorb the agent-relay retry (spec/spec_helper.rb):
    # a deterministically stuck boot can now retry up to 3×180s + waits before
    # failing, which on top of the ~11-12 min suite could otherwise clip the old
    # 20-min cap and surface a clean failure as a confusing job timeout.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev gcc make flex bison libelf-dev bc python3-pyelftools

      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: "3.4"
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true

      - name: Compile native extension
        run: bundle exec rake compile

      # Nothing provisions the host runtime at compile time any more (SDK-only
      # gem), so this IS the fallback tier under test: download into
      # ~/.microsandbox explicitly so a missing runtime fails loudly here rather
      # than silently skipping the integration specs.
      - name: Ensure runtime installed (provisioned)
        if: matrix.runtime == 'provisioned'
        run: bundle exec ruby -e 'require "microsandbox"; Microsandbox.install unless Microsandbox.installed?; abort("runtime not installed") unless Microsandbox.installed?'

      # Vendor the companion gem's runtime for this host (sha256-verified
      # against the upstream release) and put its lib/ on the load path, which
      # is how `require "microsandbox"` discovers the gem when it is installed.
      # RUBYLIB (not the Gemfile) keeps the bundle untouched; Bundler leaves
      # RUBYLIB entries on $LOAD_PATH. Then assert the tier actually won before
      # booting anything — with auto-install disabled below, a silently inactive
      # tier cannot be masked by a fallback download.
      - name: Vendor the binaries gem runtime (bundled)
        if: matrix.runtime == 'bundled'
        run: |
          bundle exec rake -C binaries 'vendor[x86_64-linux-gnu]' verify
          echo "RUBYLIB=${GITHUB_WORKSPACE}/binaries/lib" >> "$GITHUB_ENV"
          echo "MICROSANDBOX_NO_AUTO_INSTALL=1" >> "$GITHUB_ENV"
      - name: Check the SDK resolves msb into binaries/vendor (bundled)
        if: matrix.runtime == 'bundled'
        run: |
          bundle exec ruby -e '
            require "microsandbox"
            path = Microsandbox.runtime_path
            expected = File.join(Dir.pwd, "binaries", "vendor", "bin", "msb")
            abort("resolver returned #{path}, expected #{expected}") unless path == expected && path == Microsandbox::Binaries.msb_path
            abort("~/.microsandbox runtime present; the bundled lane must boot from the gem only") if Microsandbox.installed?
            puts "ok: #{path}"
          '

      # Pull from AWS's public ECR mirror of the Docker library rather than
      # docker.io: anonymous docker.io pulls are rate-limited and fail in CI
      # with "Not authorized". The ECR mirror needs no auth and isn't throttled.
      - name: Run integration specs (boots real microVMs)
        env:
          MICROSANDBOX_INTEGRATION: "1"
          MICROSANDBOX_TEST_IMAGE: public.ecr.aws/docker/library/alpine:latest
        run: bundle exec rspec spec/integration --format progress --format json --out rspec-integration.json

      # rspec exits 0 when every example is skipped, so a lane whose runtime
      # never resolved (the exact failure this matrix exists to catch) would
      # otherwise go green having booted nothing. Require real examples and
      # fail on any example skipped by spec_helper's runtime gate; list the
      # other pending ones (feature-specific skips are legitimate).
      - name: Assert the integration examples actually ran
        run: |
          ruby -rjson -e '
            r = JSON.parse(File.read("rspec-integration.json"))
            s = r.fetch("summary")
            puts "examples=#{s["example_count"]} failures=#{s["failure_count"]} pending=#{s["pending_count"]}"
            abort("no integration examples ran") if s["example_count"].to_i.zero?
            pending = r.fetch("examples").select { |e| e["status"] == "pending" }
            pending.each { |e| puts "pending: #{e["full_description"]} — #{e["pending_message"]}" }
            gated = pending.select { |e| e["pending_message"].to_s.match?(/runtime not resolvable|MICROSANDBOX_INTEGRATION/) }
            abort("#{gated.size} integration examples were skipped by the runtime gate") unless gated.empty?
          '

  # The companion `microsandbox-rb-binaries` platform gems: vendor every
  # supported platform's upstream release bundle (downloads only — no matching
  # host needed — each sha256-verified fail-closed against the release's
  # checksums.sha256), package them, and smoke-run the host one. The artifact
  # feeds the `package` job's end-to-end check. No Rust toolchain, no Bundler:
  # binaries/ is plain Ruby + rake.
  binaries:
    name: binaries gem (vendor + build all platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - name: Vendor + build every platform gem
        run: rake -C binaries vendor:all
      - name: Smoke-test the host platform gem (msb --version)
        # vendor:all leaves the last platform in vendor/; re-vendor the host's
        # so `rake verify` runs the binary this runner can execute, then
        # install the packaged gem and run msb from the *installed* location
        # (outside the checkout) to prove the executable bit and layout survive
        # RubyGems packaging.
        run: |
          rake -C binaries 'vendor[x86_64-linux-gnu]' verify
          gem install --local --no-document binaries/pkg/microsandbox-rb-binaries-*-x86_64-linux-gnu.gem
          cd "$RUNNER_TEMP"
          ruby -rmicrosandbox/binaries -e '
            msb = Microsandbox::Binaries.msb_path or abort("installed gem carries no msb")
            abort("installed gem carries no libkrunfw") unless Microsandbox::Binaries.libkrunfw_path
            out = IO.popen([msb, "--version"], &:read)
            abort("msb --version failed") unless $?.success?
            abort("msb reports #{out.strip.inspect}") unless out.split.include?(Microsandbox::Binaries::RUNTIME_VERSION.delete_prefix("v"))
            puts "ok: #{out.strip} (#{Microsandbox::Binaries.platform}) from #{msb}"
          '
      - name: List built gems
        run: ls -la binaries/pkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-gems
          path: binaries/pkg/*.gem
          if-no-files-found: error

  lint:
    name: lint (rustfmt + clippy + cargo-deny + standardrb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: "3.4"
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true
      - name: rustfmt
        run: cargo fmt --check --manifest-path ext/microsandbox/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path ext/microsandbox/Cargo.toml -- -D warnings
      # Known advisories (RustSec) against everything in Cargo.lock. The config
      # is deny.toml at the repository root, which cargo-deny finds at the
      # workspace root (kept out of ext/ so the gem does not pack it): it holds
      # the exceptions (advisories with no fix at the pinned runtime). A new
      # advisory published upstream turns this red on an otherwise unchanged
      # tree — that is the point; update the crate or, only when there is no
      # fixed release, add it there with a reason.
      - name: cargo-deny (advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          manifest-path: ext/microsandbox/Cargo.toml
      # Ruby lint/format for the lib/ + spec/ + binaries/ layers (StandardRB,
      # zero-config; it scans every Ruby file in the checkout).
      - name: standardrb
        run: bundle exec standardrb
