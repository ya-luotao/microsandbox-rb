name: Release

# Publishes the gems to RubyGems on a version tag (vX.Y.Z), or only builds the
# artifacts on manual dispatch (nothing is published). Produces:
#   - the source gem `microsandbox-rb` (compiles the Rust extension at install
#     time via rb_sys, so it needs a Rust toolchain on the installing host)
#   - the three companion `microsandbox-rb-binaries` platform gems
#
# Precompiled *extension* gems are not built or published: every platform
# installs the source gem.
#
# The native extension depends on the microsandbox core crate via a pinned git
# tag, so every build is self-contained (no adjacent checkout needed).
#
# Publishing uses RubyGems Trusted Publishing (OIDC); configure the gem's trusted
# publisher to this repo + workflow in the RubyGems UI before the first release.
#
# What the SDK gem ships (and what it does NOT): the extension it compiles
# carries the guest-side `agentd` baked in (the core's filesystem build.rs
# downloads agentd by *target* arch and embeds it with include_bytes!). The gem
# does NOT carry the host-side `msb` runtime + `libkrunfw`: the SDK gem is
# SDK-only. Those ship in the companion `microsandbox-rb-binaries` platform gems
# (built by the `binaries-gems` job below from the upstream release, verified
# against the checksums committed under binaries/checksums/, and published on
# the same tag) — or, without that gem, are downloaded into ~/.microsandbox on
# first use by `Microsandbox.ensure_runtime!` (by the *running* host's arch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but do not publish"
        type: boolean
        default: true
      preflight_ref:
        description: "tag to dry-run the release preflight against; nothing is published"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # The companion runtime gems: one `microsandbox-rb-binaries` gem per platform
  # (arm64-darwin, x86_64-linux-gnu, aarch64-linux-gnu), vendored from the
  # upstream release named by Microsandbox::Binaries::RUNTIME_VERSION and
  # sha256-verified fail-closed against binaries/checksums/<tag>.sha256 (the live
  # release file must agree). Builds on every run; only `publish-binaries`
  # pushes, and a failure here blocks `publish` as well (see there). Their
  # RubyGems trusted publisher is a separate entry for the new gem name (same
  # repo + workflow), created as a *pending* publisher before the first push.
  binaries-gems:
    name: binaries gems (all platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      # The companion gem rides the lockstep version train: its VERSION must be
      # the tag's, or the SDK would warn and ignore it at runtime.
      - name: Check the binaries gem version matches the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          ruby -r./binaries/lib/microsandbox/binaries -e '
            tag = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v")
            v = Microsandbox::Binaries::VERSION
            abort("Microsandbox::Binaries::VERSION is #{v} but the tag is v#{tag} — bump binaries/lib/microsandbox/binaries.rb") unless v == tag
            puts "binaries gem version #{v} matches tag"
          '
      - name: Vendor + build every platform gem
        run: rake -C binaries vendor:all
      - name: Smoke-test the host platform gem (msb --version)
        run: rake -C binaries 'vendor[x86_64-linux-gnu]' verify
      - run: ls -la binaries/pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-binaries
          path: binaries/pkg/*.gem
          if-no-files-found: error

  source-gem:
    name: source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      # The gem that gets PUBLISHED is built with plain `gem build`: no Bundler,
      # no `bundle install`, so nothing from the (unlocked — Gemfile.lock is not
      # committed) development dependency closure runs in the job that produces
      # the release artifact. The gemspec needs only lib/microsandbox/version.rb.
      # `bundle exec rake build` yields an identical file list and metadata;
      # it stays in ci.yml's `package` job, which installs what it builds.
      - name: Build the source gem (gem build, no Bundler)
        run: |
          version="$(ruby -Ilib -r microsandbox/version -e 'print Microsandbox::VERSION')"
          mkdir -p pkg
          gem build microsandbox-rb.gemspec --output "pkg/microsandbox-rb-${version}.gem"
          ls -la pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-source
          path: pkg/*.gem
          if-no-files-found: error

  # The release gate. Nothing is pushed to RubyGems unless this passes:
  #   - the tag is vX.Y.Z and the three lock-step version constants in the
  #     tagged commit (Microsandbox::VERSION, the ext crate's [package] version,
  #     Microsandbox::Binaries::VERSION) all equal X.Y.Z;
  #   - the tagged commit is on main;
  #   - the `CI` workflow's push run for that exact commit concluded `success`.
  # The release SOP pushes main and the tag in one `git push`, so that CI run is
  # usually still in progress (or not created yet) when this job starts: the
  # script waits for it, bounded by PREFLIGHT_CI_WAIT_SECONDS (default 45 min,
  # under this job's 60 min cap). A tag release therefore publishes only after
  # CI — including the real-microVM integration lanes — has finished green.
  #
  # The logic lives in .github/scripts/release_preflight.sh so it can be run
  # locally. Dry run against an existing tag, publishing nothing:
  #   gh workflow run release.yml --ref main -f preflight_ref=vX.Y.Z
  # (a dispatch without `preflight_ref` skips this job).
  #
  # This is a workflow-level gate, not a repository one: it does not stop a
  # maintainer from editing the workflow. Branch protection / a protected
  # `environment` on the trusted publisher are repository settings.
  preflight:
    name: release preflight
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.preflight_ref != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # gh run list: find the CI run of the tagged commit
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Never interpolated into the script text: passed through the environment.
      PREFLIGHT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + all tags: the script resolves the tag and asks
          # whether its commit is an ancestor of origin/main. (NOT
          # fetch-tags:true — see the note in `github-release` below.)
          fetch-depth: 0
      # The version constants are read by requiring the two Ruby files.
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - name: Release preflight
        run: .github/scripts/release_preflight.sh "$PREFLIGHT_TAG"

  publish:
    name: publish to RubyGems
    # Pushes the SDK source gem, and only when all three of these succeeded:
    #   - `preflight`: the tag is a real, green release (see above);
    #   - `source-gem`: the gem being pushed;
    #   - `binaries-gems`: the three companion runtime gems BUILT (vendored,
    #     checksum-verified, packaged, smoke-run). A companion build failure
    #     therefore blocks the SDK publish too: the two gems ship in lockstep,
    #     so the SDK is not pushed when its companions could not even be built.
    #     (Before, this job needed only `source-gem` so a companion failure
    #     could never block the SDK release.)
    # The companion gems are still PUSHED by `publish-binaries` below, after
    # this job. A companion push failure is its own red job once the SDK gem is
    # live — the SDK version is then on RubyGems without its companions until
    # `publish-binaries` is re-run.
    needs: [source-gem, binaries-gems, preflight]
    runs-on: ubuntu-latest
    # Real tag pushes only — never on a manual dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem-source
          path: dist
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      # Exchange the GitHub OIDC token for short-lived RubyGems credentials.
      # This is the official trusted-publishing action — NO RUBYGEMS_API_KEY
      # secret is needed. (`rubygems/release-gem` is the all-in-one wrapper that
      # runs `rake release`; it builds a single gem and so doesn't fit pushing
      # the several pre-built per-platform gems this pipeline produces.)
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        # Pinned to a full commit SHA (supply-chain hardening for a workflow that
        # holds publish privileges); the comment tracks the human-readable version.
        # Bump the SHA when upgrading (e.g. via Dependabot).
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the SDK gem
        run: |
          shopt -s nullglob
          gems=(dist/microsandbox-rb-[0-9]*.gem)
          [ "${#gems[@]}" -eq 1 ] || { echo "expected exactly one SDK gem, found: ${gems[*]}"; exit 1; }
          for gem in "${gems[@]}"; do
            echo "Pushing $gem"
            # Idempotent: RubyGems rejects re-pushing an existing version. Tolerate
            # that specific rejection so a re-run (e.g. after a later job failed, or
            # a partial multi-gem push) succeeds instead of dead-ending here — any
            # other failure still aborts the publish. The `if` guard is required so
            # `set -e` (Actions' default `bash -eo pipefail`) does not exit on the
            # push before we can inspect the rejection message.
            if out="$(gem push "$gem" 2>&1)"; then
              printf '%s\n' "$out"
            else
              rc=$?
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE 'already been pushed|Repushing of gem versions|already exists'; then
                echo "::notice::$gem is already on RubyGems — skipping (idempotent re-run)"
              else
                exit "$rc"
              fi
            fi
          done

  publish-binaries:
    name: publish binaries gems to RubyGems
    # The three companion runtime gems, pushed only once the SDK gem is live
    # (`needs: publish`, which itself needs `binaries-gems` and `preflight` —
    # so a failed companion build or preflight skips BOTH publish jobs).
    # Still its own job on purpose: if a push fails here (e.g. the trusted
    # publisher for the companion gem name not configured) only this job goes
    # red — the SDK gem is already live and the GitHub Release (gated on
    # `publish`) is unaffected. Same OIDC exchange: the companion gem has its
    # own trusted-publisher entry for this workflow. Re-run is idempotent (see
    # the push loop).
    needs: [binaries-gems, publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem-binaries
          path: dist
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the binaries gems
        run: |
          shopt -s nullglob
          gems=(dist/microsandbox-rb-binaries-*.gem)
          [ "${#gems[@]}" -eq 3 ] || { echo "expected three companion gems, found: ${gems[*]}"; exit 1; }
          for gem in "${gems[@]}"; do
            echo "Pushing $gem"
            if out="$(gem push "$gem" 2>&1)"; then
              printf '%s\n' "$out"
            else
              rc=$?
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE 'already been pushed|Repushing of gem versions|already exists'; then
                echo "::notice::$gem is already on RubyGems — skipping (idempotent re-run)"
              else
                exit "$rc"
              fi
            fi
          done

  github-release:
    name: GitHub Release
    # Create the GitHub Release once the gem is published, so a tag produces BOTH
    # the RubyGems publish and a Releases-page entry. release.yml historically did
    # only the former, leaving every tag's GitHub Release to be made by hand. Notes
    # are sliced from the matching CHANGELOG.md section on the tagged commit; gated
    # on `needs: [publish]` so a failed gem push never yields a dangling Release.
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create/edit the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + all tags, so the "is this the newest tag?" check below
          # (git tag --sort=-v:refname) sees every version. NOT fetch-tags:true —
          # on a tag-triggered run checkout resolves github.ref to the commit SHA
          # and fetch-tags then races the tag onto the same ref, failing with
          # "Cannot fetch both <sha> and refs/tags/<tag>" (actions/checkout#1781).
          fetch-depth: 0
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"   # vX.Y.Z
          ver="${tag#v}"             # X.Y.Z
          notes="$(mktemp)"
          # Slice the [X.Y.Z] section out of the Keep-a-Changelog file.
          awk -v ver="$ver" '
            $0 ~ ("^## \\[" ver "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || echo "::warning::no CHANGELOG section for $ver; falling back to generated notes"
          # Only claim the "Latest" badge when this tag is the highest version, so a
          # backport tag pushed after a newer release does NOT seize Latest (a bare
          # --latest would force it unconditionally). create_latest is always explicit;
          # on the re-run/edit path we pass --latest only when newest and otherwise
          # leave the existing flag untouched.
          newest="$(git tag --sort=-v:refname | head -n1)"
          create_latest=(--latest); edit_latest=(--latest)
          if [ "$tag" != "$newest" ]; then create_latest=(--latest=false); edit_latest=(); fi
          echo "newest version tag: $newest; this tag: $tag -> ${create_latest[*]}"
          # Idempotent: a re-run of a tag may find the Release already created.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists — refreshing notes"
            if [ -s "$notes" ]; then
              gh release edit "$tag" "${edit_latest[@]}" --notes-file "$notes"
            elif [ "${#edit_latest[@]}" -gt 0 ]; then
              gh release edit "$tag" "${edit_latest[@]}"
            else
              echo "nothing to update (release exists, no CHANGELOG section, not newest)"
            fi
          elif [ -s "$notes" ]; then
            gh release create "$tag" --title "$tag" "${create_latest[@]}" --verify-tag --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" "${create_latest[@]}" --verify-tag --generate-notes
          fi
