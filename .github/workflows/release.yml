name: Release

# Publishes the gem to RubyGems on a version tag (vX.Y.Z), or builds artifacts
# only on manual dispatch (dry run). Produces:
#   - precompiled, multi-ABI platform gems via rake-compiler-dock (oxidize-rb
#     cross-gem-action): one fat gem per platform, covering Ruby 3.1–3.4
#   - the pure source gem (fallback for unlisted platforms; needs a Rust toolchain)
#
# The native extension depends on the microsandbox core crate via a pinned git
# tag, so every build is self-contained (no adjacent checkout needed) — the
# rake-compiler-dock containers fetch it from git.
#
# Publishing uses RubyGems Trusted Publishing (OIDC); configure the gem's trusted
# publisher to this repo + workflow in the RubyGems UI before the first release.
#
# What a precompiled gem ships (and what it does NOT): the gem carries the
# compiled Rust extension with the guest-side `agentd` baked in (the core's
# filesystem build.rs downloads agentd by *target* arch via CARGO_CFG_TARGET_ARCH
# and embeds it with include_bytes!, so it cross-compiles correctly). The gem
# does NOT carry the host-side `msb` runtime + `libkrunfw`: the SDK gem is
# SDK-only. Those ship in the companion `microsandbox-rb-binaries` platform gems
# (built by the `binaries-gems` job below from the upstream release, verified
# against the checksums committed under binaries/checksums/, and published on
# the same tag) — or, without that gem, are downloaded into ~/.microsandbox on
# first use by `Microsandbox.ensure_runtime!` (by the *running* host's arch).
#
# Cross-compile reality check (corrects an earlier, pessimistic note here):
#   - The SDK crate's `prebuilt` feature (host msb download at compile time) is
#     off, so nothing host-arch-specific enters the build; libkrunfw is dlopen'd
#     by msb at runtime and is never *linked* into the extension.
#   - The genuine cross blockers are the *target* native libraries the extension
#     links: libcap-ng on Linux (via the capng crate → msb_krun_devices) and the
#     Hypervisor + Security system frameworks on macOS (HVF + Apple-native keyring).
#     aarch64-linux therefore needs libcap-ng:arm64 (handled below via Debian
#     multiarch); arm64-darwin needs osxcross to resolve those frameworks from the
#     macOS SDK — that's the one platform still to confirm on first dispatch. If it
#     can't link, move arm64-darwin to a native macos-14 runner job (which builds
#     all 3.1–3.4 ABIs into one fat gem with no osxcross involved).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Precompiled per-platform gems — a UX optimization (users skip the Rust
  # compile). Gated to manual `workflow_dispatch`: tag releases ship the source
  # gem (which installs everywhere by compiling via rb_sys), while precompiled
  # gems are built best-effort here for validation. They are NOT auto-published
  # on tags yet, because a gem that *compiles but doesn't boot a microVM* would
  # be served to users in preference to the source gem — and CI cannot boot a VM
  # to prove it works (no nested virt). Validate a dispatched build by installing
  # the artifact on each real platform, then promote it (see `publish` below).
  #
  # cross-compile prerequisites handled below:
  #   - bundle install: rake/rb_sys/rake-compiler inside the dock container
  #     (else Bundler::GemNotFound).
  #   - libcap-ng: host package for x86_64-linux; the arm64 multiarch variant for
  #     aarch64-linux (the extension links -lcap-ng for the *target* arch).
  cross-gems:
    name: gem (${{ matrix.platform }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - arm64-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build precompiled gem
        # v7 is the latest release of this action; pinned to its commit SHA.
        uses: oxidize-rb/cross-gem-action@80f59339d90789841d772f412fe4a8b201a8cfa2 # v7
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.1,3.2,3.3,3.4"
          # The extension links libcap-ng on Linux targets (capng crate →
          # msb_krun_devices), so the rake-compiler-dock container needs the dev
          # package before the cross-build (else `cannot find -lcap-ng`). The
          # Linux containers are Debian-based (apt); darwin needs nothing here
          # (its frameworks come from the osxcross macOS SDK), so the apt guard
          # keeps it from erroring.
          #
          # aarch64-linux is cross-compiled from an x86_64 container: the target
          # linker (aarch64-linux-gnu) resolves -lcap-ng from the *arm64* sysroot,
          # not the host package — so add the arch and install libcap-ng-dev:arm64.
          # Debian's main mirror carries every arch, so multiarch fetches work
          # without switching to ports.ubuntu.com.
          setup: |
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y libcap-ng-dev
              case "${{ matrix.platform }}" in
                aarch64-linux*)
                  dpkg --add-architecture arm64
                  apt-get update
                  apt-get install -y libcap-ng-dev:arm64
                  ;;
              esac
            fi
            # The dock container runs `bundle exec rake native:<plat> gem`; install
            # the bundle (rb_sys/rake/rake-compiler) first or it fails with
            # Bundler::GemNotFound. Skip the dev group (rspec etc. aren't needed to build).
            bundle config set --local without development
            bundle install --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem

  # The companion runtime gems: one `microsandbox-rb-binaries` gem per platform
  # (arm64-darwin, x86_64-linux-gnu, aarch64-linux-gnu), vendored from the
  # upstream release named by Microsandbox::Binaries::RUNTIME_VERSION and
  # sha256-verified fail-closed against binaries/checksums/<tag>.sha256 (the live
  # release file must agree). Builds on every run; only `publish` pushes. Their
  # RubyGems trusted publisher is a separate entry for the new gem name (same
  # repo + workflow), created as a *pending* publisher before the first push.
  binaries-gems:
    name: binaries gems (all platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The companion gem rides the lockstep version train: its VERSION must be
      # the tag's, or the SDK would warn and ignore it at runtime.
      - name: Check the binaries gem version matches the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          ruby -r./binaries/lib/microsandbox/binaries -e '
            tag = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v")
            v = Microsandbox::Binaries::VERSION
            abort("Microsandbox::Binaries::VERSION is #{v} but the tag is v#{tag} — bump binaries/lib/microsandbox/binaries.rb") unless v == tag
            puts "binaries gem version #{v} matches tag"
          '
      - name: Vendor + build every platform gem
        run: rake -C binaries vendor:all
      - name: Smoke-test the host platform gem (msb --version)
        run: rake -C binaries 'vendor[x86_64-linux-gnu]' verify
      - run: ls -la binaries/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: gem-binaries
          path: binaries/pkg/*.gem
          if-no-files-found: error

  source-gem:
    name: source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake build
      - uses: actions/upload-artifact@v4
        with:
          name: gem-source
          path: pkg/*.gem

  publish:
    name: publish to RubyGems
    # On a tag push, only `source-gem` is needed here: this publishes the SDK
    # source gem alone, exactly the pre-companion path. The companion runtime
    # gems are pushed by `publish-binaries` below, which runs AFTER this job —
    # a companion build or push failure is therefore its own red job and can
    # never block the SDK release (a `needs` on `binaries-gems` here would skip
    # this whole job when that build fails). cross-gems (precompiled extension
    # gems) remain workflow_dispatch-only; once validated they can be promoted
    # by re-adding `cross-gems` to `needs` and dropping its dispatch gate.
    needs: [source-gem]
    runs-on: ubuntu-latest
    # Real tag pushes only — never on a manual dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gem-source
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # Exchange the GitHub OIDC token for short-lived RubyGems credentials.
      # This is the official trusted-publishing action — NO RUBYGEMS_API_KEY
      # secret is needed. (`rubygems/release-gem` is the all-in-one wrapper that
      # runs `rake release`; it builds a single gem and so doesn't fit pushing
      # the several pre-built per-platform gems this pipeline produces.)
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        # Pinned to a full commit SHA (supply-chain hardening for a workflow that
        # holds publish privileges); the comment tracks the human-readable version.
        # Bump the SHA when upgrading (e.g. via Dependabot).
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the SDK gem
        run: |
          shopt -s nullglob
          gems=(dist/microsandbox-rb-[0-9]*.gem)
          [ "${#gems[@]}" -eq 1 ] || { echo "expected exactly one SDK gem, found: ${gems[*]}"; exit 1; }
          for gem in "${gems[@]}"; do
            echo "Pushing $gem"
            # Idempotent: RubyGems rejects re-pushing an existing version. Tolerate
            # that specific rejection so a re-run (e.g. after a later job failed, or
            # a partial multi-gem push) succeeds instead of dead-ending here — any
            # other failure still aborts the publish. The `if` guard is required so
            # `set -e` (Actions' default `bash -eo pipefail`) does not exit on the
            # push before we can inspect the rejection message.
            if out="$(gem push "$gem" 2>&1)"; then
              printf '%s\n' "$out"
            else
              rc=$?
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE 'already been pushed|Repushing of gem versions|already exists'; then
                echo "::notice::$gem is already on RubyGems — skipping (idempotent re-run)"
              else
                exit "$rc"
              fi
            fi
          done

  publish-binaries:
    name: publish binaries gems to RubyGems
    # The three companion runtime gems, pushed only once the SDK gem is live
    # (`needs: publish`). Isolated on purpose: if `binaries-gems` failed this
    # job is skipped, if a push fails (e.g. the trusted publisher for the new
    # gem name not configured) only this job goes red — the SDK release and the
    # GitHub Release (gated on `publish`) are unaffected. Same OIDC exchange:
    # the companion gem has its own trusted-publisher entry for this workflow.
    # Re-run is idempotent (see the push loop).
    needs: [binaries-gems, publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gem-binaries
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the binaries gems
        run: |
          shopt -s nullglob
          gems=(dist/microsandbox-rb-binaries-*.gem)
          [ "${#gems[@]}" -eq 3 ] || { echo "expected three companion gems, found: ${gems[*]}"; exit 1; }
          for gem in "${gems[@]}"; do
            echo "Pushing $gem"
            if out="$(gem push "$gem" 2>&1)"; then
              printf '%s\n' "$out"
            else
              rc=$?
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE 'already been pushed|Repushing of gem versions|already exists'; then
                echo "::notice::$gem is already on RubyGems — skipping (idempotent re-run)"
              else
                exit "$rc"
              fi
            fi
          done

  github-release:
    name: GitHub Release
    # Create the GitHub Release once the gem is published, so a tag produces BOTH
    # the RubyGems publish and a Releases-page entry. release.yml historically did
    # only the former, leaving every tag's GitHub Release to be made by hand. Notes
    # are sliced from the matching CHANGELOG.md section on the tagged commit; gated
    # on `needs: [publish]` so a failed gem push never yields a dangling Release.
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create/edit the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all tags, so the "is this the newest tag?" check below
          # (git tag --sort=-v:refname) sees every version. NOT fetch-tags:true —
          # on a tag-triggered run checkout resolves github.ref to the commit SHA
          # and fetch-tags then races the tag onto the same ref, failing with
          # "Cannot fetch both <sha> and refs/tags/<tag>" (actions/checkout#1781).
          fetch-depth: 0
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"   # vX.Y.Z
          ver="${tag#v}"             # X.Y.Z
          notes="$(mktemp)"
          # Slice the [X.Y.Z] section out of the Keep-a-Changelog file.
          awk -v ver="$ver" '
            $0 ~ ("^## \\[" ver "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || echo "::warning::no CHANGELOG section for $ver; falling back to generated notes"
          # Only claim the "Latest" badge when this tag is the highest version, so a
          # backport tag pushed after a newer release does NOT seize Latest (a bare
          # --latest would force it unconditionally). create_latest is always explicit;
          # on the re-run/edit path we pass --latest only when newest and otherwise
          # leave the existing flag untouched.
          newest="$(git tag --sort=-v:refname | head -n1)"
          create_latest=(--latest); edit_latest=(--latest)
          if [ "$tag" != "$newest" ]; then create_latest=(--latest=false); edit_latest=(); fi
          echo "newest version tag: $newest; this tag: $tag -> ${create_latest[*]}"
          # Idempotent: a re-run of a tag may find the Release already created.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists — refreshing notes"
            if [ -s "$notes" ]; then
              gh release edit "$tag" "${edit_latest[@]}" --notes-file "$notes"
            elif [ "${#edit_latest[@]}" -gt 0 ]; then
              gh release edit "$tag" "${edit_latest[@]}"
            else
              echo "nothing to update (release exists, no CHANGELOG section, not newest)"
            fi
          elif [ -s "$notes" ]; then
            gh release create "$tag" --title "$tag" "${create_latest[@]}" --verify-tag --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" "${create_latest[@]}" --verify-tag --generate-notes
          fi
