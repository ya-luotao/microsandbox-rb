# cargo-deny configuration for the native extension. Only the advisories check
# is configured and run:
#
#   cargo deny --manifest-path ext/microsandbox/Cargo.toml check advisories
#
# (the `lint` job in .github/workflows/ci.yml). cargo-deny finds this file
# because it sits at the workspace root, next to the root Cargo.toml and
# Cargo.lock. It lives here rather than in ext/microsandbox/ on purpose: the
# gemspec packs `ext/**/*.toml`, and a CI-only config has no business in the
# published gem. Yanked crates stay at the default (a warning, not a failure).

[advisories]
# "Unmaintained" notices fail only for this crate's DIRECT dependencies.
# Transitive ones (today: proc-macro-error2 via sea-orm) are inherited from the
# pinned upstream runtime and cannot be resolved from this repository.
unmaintained = "workspace"

# Vulnerabilities with NO fixed release to move to at the pinned upstream
# runtime (Microsandbox::RUNTIME_VERSION). Never add an advisory that has a
# compatible fix — update the crate instead — and re-check every entry on each
# runtime adoption.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.10.0-rc.18 (Marvin Attack timing side channel): no patched release exists, 0.9.x and 0.10.0-rc are both affected; pulled in only by the pinned upstream runtime via russh / ssh-key. Re-check on the next runtime adoption." },
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 (abandoned-stream data leaks into the next stream on a reused context): the fix is zstd 0.14, a semver-incompatible bump. Reachable only through msb_krun_vmm 0.1.32 (pinned via msb_krun =0.1.32 by the upstream runtime; no msb_krun_vmm release moves past zstd ^0.13), which uses it only on x86_64 to decompress an external Image.zst kernel — the runtime never configures one (it boots from libkrunfw), and VMs boot in the msb process, not the gem. The SDK's own image-layer path is on zstd 0.14.3. Re-check on the next runtime adoption." },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.2.4 (Seekable::decompress sets a Vec length past its capacity): the fix is zstd-safe 8.2, a semver-incompatible bump. Reachable only through zstd 0.13.3 in msb_krun_vmm 0.1.32 — see RUSTSEC-2026-0391 — which never uses the seekable API. Re-check on the next runtime adoption." },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.2.4 (uninitialized memory exposed when streaming decompression of a legacy frame fails): the fix is zstd-safe 8.2, a semver-incompatible bump. Reachable only through zstd 0.13.3 in msb_krun_vmm 0.1.32 — see RUSTSEC-2026-0391 — on an external-kernel path the runtime never takes. Re-check on the next runtime adoption." },
]
