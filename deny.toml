# cargo-deny configuration for the native extension. Only the advisories check
# is configured and run:
#
#   cargo deny --manifest-path ext/microsandbox/Cargo.toml check advisories
#
# (the `lint` job in .github/workflows/ci.yml). cargo-deny finds this file
# because it sits at the workspace root, next to the root Cargo.toml and
# Cargo.lock. It lives here rather than in ext/microsandbox/ on purpose: the
# gemspec packs `ext/**/*.toml`, and a CI-only config has no business in the
# published gem. Yanked crates stay at the default (a warning, not a failure).

[advisories]
# "Unmaintained" notices fail only for this crate's DIRECT dependencies.
# Transitive ones (today: proc-macro-error2 via sea-orm) are inherited from the
# pinned upstream runtime and cannot be resolved from this repository.
unmaintained = "workspace"

# Vulnerabilities with NO fixed release to move to at the pinned upstream
# runtime (Microsandbox::RUNTIME_VERSION). Never add an advisory that has a
# compatible fix — update the crate instead — and re-check every entry on each
# runtime adoption.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.10.0-rc.18 (Marvin Attack timing side channel): no patched release exists, 0.9.x and 0.10.0-rc are both affected; pulled in only by the pinned upstream runtime via russh 0.65 / ssh-key. Re-check on the next runtime adoption." },
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30.1 (bundled SQLite < 3.54.0 returns uninitialized page-cache memory for a crafted database + sibling -wal pair): the fix is libsqlite3-sys >= 0.39.0, but the pinned upstream runtime's sqlx-sqlite 0.9.0 requires libsqlite3-sys >=0.30.1, <0.38.0, so there is no compatible fixed release. Exploitation needs a less-trusted party to write the catalog database and its -wal; the catalog lives under the SDK home, whose catalog directory is owner-only since runtime v0.7.12 (ancestors that are group/world-writable without the sticky bit are refused). 0.30.1 is also the version upstream ships and the one the macOS lost-catalog-write fix (#1709) was verified against. Re-check on the next runtime adoption." },
]
