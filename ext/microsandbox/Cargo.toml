[package]
# Distinct from the core `microsandbox` package: Cargo refuses two packages with
# the same name in one lockfile. The native artifact is loaded internally as
# `microsandbox/microsandbox_rb` and stays hidden behind `require "microsandbox"`.
name = "microsandbox_rb"
description = "Ruby SDK native extension for microsandbox — secure, fast microVM-based sandboxing."
# Must equal Microsandbox::VERSION (lib/microsandbox/version.rb) — Native.version
# returns this via env!("CARGO_PKG_VERSION") and version_spec.rb asserts equality.
# The core-crate dependencies below stay on their own tag, which is
# Microsandbox::RUNTIME_VERSION and moves independently of this version.
version = "0.18.0"
authors = ["Super Rad Company <development@superrad.company>"]
repository = "https://github.com/superradcompany/microsandbox"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
# Produces libmicrosandbox_rb.{dylib,so}; rb-sys renames it to
# microsandbox/microsandbox_rb.{bundle,so}. The magnus #[init] entrypoint is
# therefore Init_microsandbox_rb (matches the loaded basename).
name = "microsandbox_rb"
crate-type = ["cdylib"]

[dependencies]
# "rb-sys" exposes `magnus::rb_sys::protect` (rb_protect), which the GVL bridge
# uses to check interrupts without letting Ruby longjmp over Rust frames.
# Default features are off: `old-api` (the free functions that conjure a `Ruby`
# handle unchecked in release builds) must not creep back, and `io` only gates
# `magnus::io`, which the extension does not use.
magnus = { version = "0.9", default-features = false, features = ["rb-sys"] }
# Low-level Ruby C API — used directly for rb_thread_call_without_gvl2 (GVL
# release during blocking sandbox calls) and rb_thread_check_ints. Kept in
# lock-step with magnus's own rb-sys.
rb-sys = "0.9"

# `pthread_atfork`, for the fork generation (runtime::ProcessIdentity). Already
# in the dependency graph; listed so the binding can call it directly.
libc = "0.2"

# The microsandbox core runtime, wrapped via FFI exactly like the official
# Python (pyo3) and Node (napi) SDKs. Pinned to the matching upstream tag so the
# gem is self-contained and buildable anywhere (CI, release containers, end-user
# source installs) without an adjacent checkout. For local development against a
# sibling checkout, use the `paths` override in `.cargo/config.toml` (see
# `.cargo/config.toml.example`).
#
# Features are listed explicitly (default-features = false). Two SDK features
# must stay OFF: "download-binaries" (its build.rs downloads the msb + libkrunfw
# *host runtime* into ~/.microsandbox at compile time) and "embed-binaries"
# (`include_bytes!` of the whole runtime tarball). This gem is SDK-only — the
# host runtime comes from the companion `microsandbox-rb-binaries` gem (see
# binaries/) or, as the lowest tier, the first-use download into
# ~/.microsandbox (`setup::install_runtime`, which is not gated on either
# feature). The *guest* agent (`agentd`) ships inside `msb` itself (the msb
# release build embeds it), so the SDK embeds nothing. "cloud"/"keyring"/
# "local"/"net"/"ssh" are the features the official SDKs ship with.
#
# `microsandbox-network` is a direct dependency only for its builder/config
# types; `default-features = false` keeps its packet-processing engine out of
# this extension (the SDK depends on it the same way).
microsandbox = { git = "https://github.com/superradcompany/microsandbox", tag = "v0.7.14", default-features = false, features = ["cloud", "keyring", "local", "net", "ssh"] }
microsandbox-network = { git = "https://github.com/superradcompany/microsandbox", tag = "v0.7.14", default-features = false }
# `microsandbox-utils` is a direct dependency only for `msb_binary_filename` /
# `libkrunfw_filename`, which the SDK does not re-export: the runtime-home
# self-check (`Native.runtime_home_pair`) must name exactly the files the
# resolver's `runtime_in_home` expects. Already in the dependency graph.
microsandbox-utils = { git = "https://github.com/superradcompany/microsandbox", tag = "v0.7.14" }

# Async core bridged to Ruby's synchronous API via a blocking tokio runtime.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures = "0.3"

# Shared (de)serialization + value types used across the binding surface.
serde_json = "1"
chrono = "0.4"
ipnetwork = { version = "0.21", features = ["serde"] }
